name: Krea 2 flow regeneration numerical tests

on:
  pull_request:
    paths:
      - "krea2_flow.py"
      - "slrd_runtime.py"
      - "nodes.py"
      - "tests/test_krea2_flow.py"
      - ".github/workflows/krea2-tests.yml"
  push:
    branches: [main]
    paths:
      - "krea2_flow.py"
      - "slrd_runtime.py"
      - "nodes.py"
      - "tests/test_krea2_flow.py"
      - ".github/workflows/krea2-tests.yml"

jobs:
  cpu-noise-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest
      - name: Compile changed Python
        run: python -m py_compile krea2_flow.py nodes.py slrd_runtime.py
      - name: Validate nested-noise coupling
        working-directory: tests
        run: python -m pytest -q --rootdir=. --confcutdir=. test_krea2_flow.py
